schema_version: 1
concepts:
  product.intent: Define the outcome the work must achieve for its users.
  product.audience: Identify the people, agents, and systems that consume the result.
  product.requirements: Separate required behavior from preferences and assumptions.
  product.constraints: Record hard limits on time, cost, compatibility, and authority.
  product.scope: Bound the work and its completion criteria.
  product.prioritization: Order work by user value, risk, and dependencies.
  product.acceptance: Make success observable before implementation.
  product.tradeoffs: Record consequential choices and their costs.
  product.lifecycle: Plan ownership, maintenance, deprecation, and removal.
  research.discovery: Find relevant primary sources and existing implementations.
  research.prior_art: Assess existing standards, native facilities, and maintained tools before building.
  research.provenance: Keep a claim traceable to its original source or observation.
  research.credibility: Judge source authority, independence, and applicability.
  research.synthesis: Combine evidence without laundering inference into fact.
  research.decision: Choose an owner for each responsibility with a review trigger.
  research.freshness: Assess evidence age against the volatility of the deciding claim.
  research.licensing: Establish reuse and redistribution rights for sources and software.
  context.instructions: Route durable instructions by authority and scope.
  context.project_knowledge: Retrieve project facts and decisions when relevant.
  context.retrieval: Select just enough source material for the current task.
  context.skills: Package repeatable procedures for on-demand use.
  context.memory: Preserve useful long-lived knowledge without treating recall as authority.
  context.compression: Retain decisions and constraints when shortening history.
  context.budget: Control the attention, token, and latency cost of supplied context.
  context.provenance: Trace context excerpts to their original material.
  context.injection: Keep untrusted content from becoming instructions.
  context.adaptation: Map shared guidance to a provider's actual instruction mechanism.
  context.sync: Detect drift between source material and derived context.
  models.selection: Choose a model for the task's required capabilities and constraints.
  models.reasoning: Set deliberation effort proportional to difficulty and stakes.
  models.routing: Map task attributes to a current model and fallback.
  models.prompting: Give clear tasks, constraints, inputs, and completion criteria.
  models.tool_use: Bound when and how a model may call tools.
  models.structured_output: Validate machine-consumed model output against a contract.
  models.multimodal: Select and verify image, audio, video, or text handling.
  models.cost_latency: Measure total time and cost at acceptable quality.
  models.fallback: Recover when a model is unavailable or fails the task.
  models.eval: Compare model behavior on representative tasks.
  agents.decomposition: Split work into independently checkable tasks when useful.
  agents.orchestration: Coordinate agent work, dependencies, and result assembly.
  agents.roles: Define specialist responsibilities and boundaries.
  agents.delegation: Delegate bounded work with a clear return contract.
  agents.isolation: Keep concurrent changes and experiments from interfering.
  agents.state: Persist the minimum state needed to resume or audit work.
  agents.handoff: Transfer constraints, evidence, and remaining work faithfully.
  agents.recovery: Resume safely after interruption or partial failure.
  agents.autonomy: Match independent action to the user's authorization and risk.
  agents.oversight: Reserve consequential choices for human judgment where needed.
  integration.protocols: Prefer interoperable protocols where they fit the job.
  integration.mcp: Connect model applications to tools and resources through MCP.
  integration.plugins: Distribute a cohesive set of capabilities across supported surfaces.
  integration.hooks: Run checks at supported lifecycle or tool events.
  integration.commands: Expose repeatable operations through native commands.
  integration.api_contracts: Define request, response, error, and compatibility behavior.
  integration.authentication: Establish identity and permissions for external systems.
  integration.external_data: Access external applications and data with explicit boundaries.
  integration.workflow_capture: Turn a demonstrated repeatable workflow into a reusable procedure.
  architecture.boundaries: Assign authority and responsibilities to clear components.
  architecture.composition: Combine existing components before adding a new platform.
  architecture.patterns: Select patterns for present needs and removal cost.
  architecture.interfaces: Keep component interfaces explicit and testable.
  architecture.contracts: State input, output, invariant, and failure conditions.
  architecture.state: Decide what state exists, who owns it, and how it changes.
  architecture.effects: Keep side effects visible and controlled.
  architecture.idempotency: Make retries safe where operations may repeat.
  architecture.concurrency: Preserve invariants under simultaneous work.
  architecture.migration: Evolve contracts and stored state without losing history.
  architecture.portability: Isolate provider or platform assumptions behind narrow adapters.
  implementation.reuse: Inspect existing code and libraries before writing a new mechanism.
  implementation.dependencies: Choose dependencies by fit, maintenance, and exit cost.
  implementation.types: Use type and schema checks to express useful invariants.
  implementation.errors: Make failures observable and recoverable at the right boundary.
  implementation.configuration: Keep runtime settings explicit and scoped.
  implementation.comments: Explain non-obvious intent and contracts without narrating code.
  implementation.debugging: Reproduce and localize faults before changing behavior.
  implementation.refactoring: Improve structure while preserving observable behavior.
  implementation.performance: Measure meaningful bottlenecks before optimizing.
  data.modeling: Represent entities, relationships, and constraints faithfully.
  data.validation: Reject malformed or out-of-contract data at a defined boundary.
  data.lineage: Track how data was sourced, transformed, and used.
  data.persistence: Choose durable storage and recovery semantics for the workload.
  data.transactions: Preserve invariants across multi-step writes.
  data.privacy: Minimize sensitive data and define its permitted uses.
  data.retention: Set deletion and archival behavior for retained data.
  data.portability: Keep data exportable and avoid needless lock-in.
  data.determinism: Produce stable, reproducible outputs where required.
  security.trust: Define trust boundaries for users, agents, tools, and data.
  security.permissions: Grant the least authority needed for an operation.
  security.sandbox: Match isolation claims to tested runtime boundaries.
  security.secrets: Keep credentials out of prompts, logs, and repositories.
  security.supply_chain: Verify the origin and integrity of dependencies and artifacts.
  security.vulnerabilities: Discover, prioritize, and remediate exploitable flaws.
  security.audit: Preserve useful records of consequential actions.
  security.threat_model: Identify plausible attackers, assets, and failure paths.
  security.abuse: Bound misuse of exposed capabilities and outputs.
  security.policy: Enforce restrictions with a mechanism that covers the action.
  quality.strategy: Choose verification proportional to risk and failure modes.
  quality.unit_tests: Check focused behavior with controlled inputs.
  quality.integration_tests: Check component boundaries and real dependencies.
  quality.end_to_end: Check a complete user or system workflow.
  quality.property_tests: Check invariants over varied generated inputs.
  quality.evaluations: Grade model or agent outcomes against representative tasks.
  quality.benchmarks: Compare performance under controlled, repeatable conditions.
  quality.review: Inspect changes for correctness, maintainability, and missed scope.
  quality.reproducibility: Preserve enough inputs and environment to repeat a result.
  quality.accessibility: Check that people can use the output across abilities and devices.
  quality.visual: Inspect rendered or interactive behavior when appearance matters.
  delivery.versioning: Communicate compatibility and change through release versions.
  delivery.git: Keep change history reviewable and preserve existing work.
  delivery.ci: Run deterministic repository gates on shared changes.
  delivery.release: Package, publish, and verify a declared version.
  delivery.deployment: Move a verified artifact into its operating environment.
  delivery.rollback: Recover from a bad release or migration.
  delivery.documentation: Give users accurate setup, usage, and limitations.
  delivery.artifacts: Produce traceable outputs and evidence of their origin.
  operations.observability: Collect signals that explain system behavior and failures.
  operations.reliability: Define and check the service behavior that must hold.
  operations.incidents: Detect, respond to, and learn from failures.
  operations.scheduling: Run recurring work with explicit ownership and failure handling.
  operations.monitoring: Watch meaningful conditions and notify the right owner.
  operations.resources: Bound compute, storage, network, and financial consumption.
  operations.backup: Restore essential state from verified backups.
  operations.support: Make diagnosis and correction possible for maintainers and users.
  communication.voice: Match tone and persona to audience and task.
  communication.anti_slop: Remove generic filler, repetition, and unsupported confidence.
  communication.clarity: Explain decisions in plain language with useful structure.
  communication.citations: Place a usable source near the claim it supports.
  communication.uncertainty: Distinguish observed results, inference, and unknowns.
  communication.ux: Make outputs and controls help people decide and act.
  communication.visualization: Use a visual when it makes relationships easier to grasp.
  context.loadouts: Select a declarative project composition with exact evidence and resource pins.
  context.capability_selection: Choose required and optional support for the actual project and stage.
  research.confidence: State strength and limitations of claim support without invented probabilities.
  quality.comments: Preserve intent, invariants and useful API contracts in accurate comments.
  web.design: Choose and critique a coherent visual direction for the product and brand.
  web.product: Make audience, primary job and truthful content govern the experience.
  web.responsive: Preserve reading order and usable controls across viewport and input sizes.
  web.motion: Use bounded purposeful motion with reduced-motion and static fallbacks.
  web.performance: Measure assets and interactions without confusing lab and field evidence.
  web.static_hosting: Match built routes and runtime features to the actual static destination.

