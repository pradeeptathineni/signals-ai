schema_version: 1
release_version: "1.0.0"
name: model-routing
description: >-
  Provider-aware policy for selecting a model profile and reasoning level from
  task intent, scope, risk, latency, autonomy, and cost constraints.
reviewed: "2026-10-05"

matching:
  strategy: first_match
  semantics:
    - All attributes in a route's match block must equal the task attributes.
    - The string "*" matches any present or absent value.
    - Evaluate routes in listed order and select the first match.
    - Resolve model_profile through the models map at execution time.
  fallback_route: general_balanced
  reasoning_aliases:
    extra_high: xhigh
    extra-high: xhigh

sources:
  openai_api_models:
    url: https://developers.openai.com/api/docs/models
    reviewed: "2026-10-05"
    covers: API model IDs, relative positioning, and reasoning levels
  codex_models:
    url: https://learn.chatgpt.com/docs/models
    reviewed: "2026-10-05"
    covers: Codex model positioning, product caveats, and current bindings

defaults:
  principles:
    - Use the least costly model that can reliably satisfy the task.
    - Increase capability or reasoning because evidence or consequence demands it.
    - Prefer fast models for bounded edit-run-inspect loops.
    - Prefer frontier judgment for ambiguity, architecture, long horizons, and high consequence.
    - Escalate after evidence of difficulty and de-escalate after isolating the hard part.
    - Depend on logical profiles and route IDs rather than scattered model IDs.

models:
  frontier:
    provider: openai
    model: gpt-6-astra
    display_name: GPT-6 Astra
    lifecycle: current
    documented_for: [openai_api, codex]
    availability: verify_for_product_auth_workspace_and_client
    reasoning:
      supported: [low, medium, high, xhigh, max]
      default: medium
    strengths:
      - hardest end-to-end work
      - complex reasoning and coding
      - computer use and research
      - long-horizon execution and judgment
    tradeoffs:
      relative_cost: highest
      latency: favor_when_quality_outweighs_interactivity
      overkill_for: bounded_mechanical_work
    recommended_intents:
      - architecture
      - difficult_reasoning
      - cross_cutting_refactors
      - deep_debugging
      - security_critical_review
      - final_adversarial_review
    source_refs: [openai_api_models, codex_models]

  balanced:
    provider: openai
    model: gpt-6.1-sol
    display_name: GPT-6.1 Sol
    lifecycle: current
    documented_for: [openai_api, codex]
    availability: verify_for_product_auth_workspace_and_client
    reasoning:
      supported: [low, medium, high, xhigh, max]
      default: medium
    strengths:
      - complex professional work
      - coding and computer use
      - research
      - general implementation from a strong specification
    tradeoffs:
      relative_cost: high
      capability: below_frontier_for_hardest_work
      overkill_for: high_volume_simple_work
    recommended_intents:
      - general_engineering
      - documentation
      - independent_second_review
      - overflow_from_frontier
    source_refs: [openai_api_models, codex_models]

  value:
    provider: openai
    model: gpt-6-luna
    display_name: GPT-6 Luna
    lifecycle: current
    documented_for: [openai_api, codex]
    availability: verify_for_product_auth_workspace_and_client
    reasoning:
      supported: [low, medium, high, xhigh, max]
      default: medium
    strengths:
      - focused everyday engineering
      - routine implementation and structured transformations
      - low-cost retryable work with clear acceptance checks
    tradeoffs:
      relative_cost: efficient_gpt_6_option
      capability: escalate_when_architecture_or_difficulty_is_unsettled
      latency: favor_bounded_work
    recommended_intents:
      - routine_implementation
      - mechanical_refactors
      - test_generation
      - cost_sensitive_agents
    source_refs: [openai_api_models, codex_models]

  bulk:
    provider: openai
    model: gpt-6-luna
    display_name: GPT-6 Luna
    lifecycle: current
    documented_for: [openai_api, codex]
    availability: verify_for_product_auth_workspace_and_client
    reasoning:
      supported: [low, medium, high, xhigh, max]
      default: medium
    strengths:
      - cost-sensitive high-volume work
      - fast everyday generation
      - classification, extraction, and repetitive transformations
    tradeoffs:
      relative_cost: efficient_gpt_6_option
      capability: not_for_deep_or_high_consequence_reasoning
      autonomy: prefer_bounded_work
    recommended_intents:
      - classification
      - extraction
      - simple_generation
      - high_volume_low_risk_work
    source_refs: [openai_api_models, codex_models]

  realtime_coding:
    provider: openai
    model: gpt-6-luna
    display_name: GPT-6 Luna
    lifecycle: current
    documented_for: [openai_api, codex]
    availability: verify_for_product_auth_workspace_and_client
    compatibility_note: Stable legacy profile name; no real-time latency guarantee after Spark retirement.
    reasoning:
      supported: [low, medium, high, xhigh, max]
      default: medium
    strengths:
      - focused coding and targeted edits
      - short feedback loops
    tradeoffs:
      relative_cost: efficient_gpt_6_option
      capability: escalate_for_hard_or_cross_cutting_work
      modality: host_defined
      overkill_for: null
    recommended_intents:
      - targeted_edits
      - bounded_implementation
      - edit_run_inspect_fix_loops
      - localized_debugging
    avoid_when:
      - long_horizon_autonomy
      - repository_wide_architecture_is_unsettled
      - deep_cross_system_reasoning
    source_refs: [codex_models, openai_api_models]

routes:
  - id: architecture_critical
    match:
      intent: architecture
      consequence: high
    select:
      model_profile: frontier
      reasoning: xhigh

  - id: difficult_coding
    match:
      intent: coding
      difficulty: high
    select:
      model_profile: frontier
      reasoning: high

  - id: complex_cross_cutting_coding
    match:
      intent: coding
      scope: cross_cutting
    select:
      model_profile: frontier
      reasoning: medium

  - id: autonomous_coding_default
    match:
      intent: coding
      autonomy: long_horizon
    select:
      model_profile: frontier
      reasoning: low

  - id: coding_from_strong_spec
    match:
      intent: coding
      requirements: explicit
      architecture: settled
    select:
      model_profile: realtime_coding
      reasoning: low
    fallback:
      model_profile: balanced
      reasoning: medium

  - id: realtime_bounded_coding
    match:
      intent: coding
      scope: bounded
      interaction: iterative
    select:
      model_profile: realtime_coding
      reasoning: low
    fallback:
      model_profile: balanced
      reasoning: medium

  - id: deep_debugging
    match:
      intent: debugging
      difficulty: high
    select:
      model_profile: frontier
      reasoning: high

  - id: localized_debugging
    match:
      intent: debugging
      scope: bounded
    select:
      model_profile: realtime_coding
      reasoning: low
    fallback:
      model_profile: balanced
      reasoning: medium

  - id: final_review
    match:
      intent: review
      depth: deep
    select:
      model_profile: frontier
      reasoning: high

  - id: independent_second_review
    match:
      intent: review
      goal: model_diversity
    select:
      model_profile: balanced
      reasoning: high

  - id: architecture_default
    match:
      intent: architecture
    select:
      model_profile: frontier
      reasoning: high

  - id: project_definition
    match:
      intent: project_definition
    select:
      model_profile: frontier
      reasoning: medium

  - id: implementation_plan
    match:
      intent: implementation_plan
    select:
      model_profile: frontier
      reasoning: high

  - id: routine_engineering
    match:
      intent: routine_engineering
    select:
      model_profile: value
      reasoning: medium

  - id: mechanical_work
    match:
      intent: mechanical
    select:
      model_profile: value
      reasoning: low

  - id: high_volume_low_risk
    match:
      intent: bulk
      consequence: low
    select:
      model_profile: bulk
      reasoning: low

  - id: documentation
    match:
      intent: documentation
    select:
      model_profile: balanced
      reasoning: medium

  - id: general_balanced
    match:
      intent: "*"
    select:
      model_profile: balanced
      reasoning: medium

escalation:
  triggers:
    - condition: repeated_failed_attempts >= 2
      action: increase_reasoning_or_model_capability
    - condition: architecture_becomes_unsettled
      action: route_to_frontier_high
    - condition: scope_expands_to_cross_cutting
      action: route_to_frontier_medium_or_high
    - condition: security_or_data_loss_consequence_becomes_high
      action: route_to_frontier_high_or_xhigh
    - condition: model_is_thrashing_or_repeating_work
      action: stop_and_reframe_before_spending_more_compute
  reasoning_chain: [low, medium, high, xhigh, max]
  capability_chain: [bulk, value, balanced, frontier]

deescalation:
  triggers:
    - condition: architecture_is_settled_and_remaining_work_is_bounded
      action: route_to_realtime_coding_or_value
    - condition: difficult_bug_has_been_isolated
      action: route_fix_and_validation_to_realtime_coding
    - condition: remaining_work_is_repetitive
      action: route_to_value_or_bulk

recommended_workflow:
  - stage: define
    route: project_definition
  - stage: design
    route: architecture_default
  - stage: challenge_design
    route: architecture_critical
  - stage: specify_phase
    route: implementation_plan
  - stage: implement_bounded_work
    route: realtime_bounded_coding
  - stage: implement_long_horizon_work
    route: autonomous_coding_default
  - stage: escalate_hard_parts
    route: difficult_coding
  - stage: deep_review
    route: final_review
  - stage: apply_review_fixes
    route: realtime_bounded_coding

maintenance:
  compatibility:
    - Keep route IDs and model profile names stable within schema version 1.
    - Change schema_version only for incompatible structure or matching semantics.
    - release_version identifies the last published repository release, not schema compatibility.
    - Keep the realtime_coding profile and route IDs stable for schema-1 consumers, but do not infer a special real-time model from their names.
  refresh:
    - Verify model names, reasoning levels, lifecycle, access, and product support before release.
    - Reasoning levels list the conservative set shared with the reviewed Codex host; do not infer API-only none or parallel Ultra support from them.
    - Do not change intent names merely because a provider renames a model.
    - Prefer source-backed qualitative tradeoffs over volatile copied price tables.
