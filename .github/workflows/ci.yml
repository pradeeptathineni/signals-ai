name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: signals_ci
          POSTGRES_USER: signals_test
          POSTGRES_PASSWORD: signals_ci
        ports:
          - 55491:5432
        options: >-
          --health-cmd "pg_isready -U signals_test -d signals_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://signals_test:signals_ci@127.0.0.1:55491/signals_ci
      TEST_DATABASE_URL: postgres://signals_test:signals_ci@127.0.0.1:55491/signals_ci_test
      SIGNALS_ALLOW_NETWORK_FETCH: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
